name: Build and Test

on:
  push:
    branches:
      - master
      - test/*
  pull_request:
    branches:
      - master
      - test/*
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  DEBUG_CONFIGURATION: Debug
  RELEASE_CONFIGURATION: Release
  DISTRIBUTION_CONFIGURATION: Dist

jobs:
  build-tests:
    name: Build and Run Tests
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run Premake Script
        run: .\vendor\premake\Scripts\ProjectGenNoPause.bat

      - name: Build Test Project
        working-directory: ${{ github.workspace }}
        # build only the test project in the solution
        run: >
          msbuild /m
          /p:Configuration=${{ env.DEBUG_CONFIGURATION }} 
          ${{ env.SOLUTION_FILE_PATH }} /t:LNTest:Rebuild

      - name: Make Test Results Folder
        shell: cmd
        run: mkdir TestResults

      - name: Run Tests
        working-directory: ${{ github.workspace }}/bin/${{ env.DEBUG_CONFIGURATION }}/windows-x86_64/LNTest
        run: .\LNTest.exe --gtest_color=yes --gtest_output="xml:${{ github.workspace }}/TestResults/test-results.xml"

      - name: Check if Report Exists
        id: check_report
        run: if not exist "${{ github.workspace }}/TestResults/test-results.xml" echo "Report not found" & exit 1
        

      - name: Create Web Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: LNTest Results
          path: ${{ github.workspace }}/TestResults/test-results.xml
          reporter: java-junit


  build-debug:
    name: Build Debug Configuration
    runs-on: self-hosted
    needs: build-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Run Premake Script
        run: .\vendor\premake\Scripts\ProjectGenNoPause.bat
      
      - name: Build Solution
        working-directory: ${{ github.workspace }}
        run: >
          msbuild /m 
          /p:Configuration=${{ env.DEBUG_CONFIGURATION }} 
          ${{ env.SOLUTION_FILE_PATH }}

      - name: Save Debug Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-build
          path: bin/${{ env.DEBUG_CONFIGURATION }}/windows-x86_64/LNApp
