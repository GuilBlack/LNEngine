name: Build and Test

on:
  push:
    branches:
      - master
      - test/*
  pull_request:
    branches:
      - master
      - test/*
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  DEBUG_CONFIGURATION: Debug
  RELEASE_CONFIGURATION: Release
  DISTRIBUTION_CONFIGURATION: Dist

jobs:
  build-tests:
    name: Build and Run Tests
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run Premake Script
        run: .\vendor\premake\Scripts\ProjectGenNoPause.bat

      - name: Build Test Project
        working-directory: ${{ github.workspace }}
        # build only the test project in the solution
        run: >
          msbuild /m
          /p:Configuration=${{ env.DEBUG_CONFIGURATION }} 
          ${{ env.SOLUTION_FILE_PATH }} /t:LNTest:Rebuild

      - name: Run Tests
        working-directory: ${{ github.workspace }}/bin/Debug/windows-x86_64/LNTest
        run: .\LNTest.exe

  build-debug:
    name: Build Debug Configuration
    runs-on: self-hosted
    needs: build-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Run Premake Script
        run: .\vendor\premake\Scripts\ProjectGenNoPause.bat
      
      - name: Build Solution
        working-directory: ${{ github.workspace }}
        run: msbuild /m /p:Configuration=${{ env.DEBUG_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      # - name: Save Debug Build Artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: debug-build
      #     path: bin/Debug/windows-x86_64
